<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Easy Shopping</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
        }

        /* Navigation */

        nav {
            background: #111827;
            color: white;
            padding: 20px 8%;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h1 {
            color: #38bdf8;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        /* Hero */

        .hero {
            text-align: center;
            padding: 60px 20px;
            background: #38bdf8;
        }

        .hero h2 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 18px;
        }

        /* Products */

        .products {
            padding: 50px 8%;
        }

        .products h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .product-container {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));

            gap: 25px;
        }

        .product {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;

            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .product img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }

        .product h3 {
            margin: 15px 0 10px;
        }

        .price {
            color: #16a34a;
            font-size: 20px;
            font-weight: bold;
        }

        .btn {
            margin-top: 15px;
            padding: 10px 20px;
            border: none;
            border-radius: 20px;

            background: #111827;
            color: white;

            cursor: pointer;
        }

        .btn:hover {
            background: #38bdf8;
            color: black;
        }

        /* Cart */

        .cart {
            background: white;
            padding: 30px 8%;
            margin-top: 30px;
        }

        .cart h2 {
            margin-bottom: 20px;
        }

        #cart-items {
            margin-bottom: 20px;
        }

        .cart-item {
            padding: 10px;
            border-bottom: 1px solid #ddd;

            display: flex;
            justify-content: space-between;
        }

        .total {
            font-size: 22px;
            font-weight: bold;
        }

        /* Footer */

        footer {
            background: #111827;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }

    </style>

</head>


<body>


    <!-- Navigation -->

    <nav>

        <h1>Easy Shopping</h1>

        <div>

            <a href="#home">Home</a>

            <a href="#products">Products</a>

            <a href="#cart">Cart 🛒</a>

        </div>

    </nav>


    <!-- Hero -->

    <section class="hero" id="home">

        <h2>Welcome to Easy Shopping</h2>

        <p>
            Find the best products at affordable prices.
        </p>

    </section>


    <!-- Products -->

    <section class="products" id="products">

        <h2>Our Products</h2>

        <div class="product-container">


            <!-- Product 1 -->

            <div class="product">

                <img
                    src="img/image4.avif"
                    alt="Laptop">

                <h3>Laptop</h3>

                <p class="price">
                    ₹50,000
                </p>

                <button
                    class="btn"
                    onclick="addToCart('Laptop', 50000)">

                    Add to Cart

                </button>

            </div>


            <!-- Product 2 -->

            <div class="product">

                <img
                    src="img/image3.webp"
                    alt="Headphones">

                <h3>Headphones</h3>

                <p class="price">
                    ₹2,000
                </p>

                <button
                    class="btn"
                    onclick="addToCart('Headphones', 2000)">

                    Add to Cart

                </button>

            </div>


            <!-- Product 3 -->

            <div class="product">

                <img
                    src="img/image2..jpg"
                    alt="Smart Watch">

                <h3>Smart Watch</h3>

                <p class="price">
                    ₹3,000
                </p>

                <button
                    class="btn"
                    onclick="addToCart('Smart Watch', 3000)">

                    Add to Cart

                </button>

            </div>


            <!-- Product 4 -->

            <div class="product">

                <img
                    src="img/image1.jpg"
                    alt="Mobile Phone">

                <h3>Mobile Phone</h3>

                <p class="price">
                    ₹20,000
                </p>

                <button
                    class="btn"
                    onclick="addToCart('Mobile Phone', 20000)">

                    Add to Cart

                </button>

            </div>


        </div>

    </section>


    <!-- Cart -->

    <section class="cart" id="cart">

        <h2>Shopping Cart 🛒</h2>

        <div id="cart-items">

            <p>
                Your cart is empty.
            </p>

        </div>

        <p class="total">

            Total:
            ₹<span id="total">0</span>

        </p>

    </section>


    <!-- Footer -->

    <footer>

        <p>
            © 2026 Easy Shopping | All Rights Reserved
        </p>

    </footer>


    <!-- JavaScript -->

    <script>

        let cart = [];

        let total = 0;


        function addToCart(name, price) {

            cart.push({
                name: name,
                price: price
            });

            total = total + price;

            displayCart();

        }


        function displayCart() {

            let cartItems =
                document.getElementById("cart-items");

            cartItems.innerHTML = "";


            if (cart.length === 0) {

                cartItems.innerHTML =
                    "<p>Your cart is empty.</p>";

                return;

            }


            cart.forEach(function(item, index) {

                let div =
                    document.createElement("div");

                div.className = "cart-item";


                div.innerHTML = `

                    <span>
                        ${item.name}
                    </span>

                    <span>
                        ₹${item.price}

                        <button
                            onclick="removeItem(${index})">

                            ❌

                        </button>

                    </span>

                `;


                cartItems.appendChild(div);

            });


            document.getElementById("total")
                .textContent = total;

        }


        function removeItem(index) {

            total = total - cart[index].price;

            cart.splice(index, 1);

            displayCart();

        }

    </script>


</body>

</html>
